<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynxere Monster Clicker</title>
    
    <!-- Link to your separate manifest.json file -->
    <link rel="manifest" href="manifest.json">

    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            margin: 0;
        }
        #clicker { 
            font-size: 3rem; 
            background: #ff4757; 
            border: none; 
            border-radius: 50%; 
            width: 180px; 
            height: 180px; 
            color: white; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            margin: 20px auto; 
            display: block;
        }
        #clicker:active { 
            transform: scale(0.95); 
        }
        .score { 
            font-size: 2.2rem; 
            color: #2ed573; 
            margin-bottom: 10px; 
        }
        .cps { 
            font-size: 1.2rem; 
            color: #ffa502; 
            margin-bottom: 20px; 
        }
        button.turbo { 
            background: #2ed573; 
            font-size: 1rem; 
            border-radius: 8px; 
            padding: 10px 20px; 
            color: #000; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h1>Zynxere Monster Clicker</h1>
    <div class="score">Score: <span id="scoreVal">0</span></div>
    <div class="cps">Clicks per second: <span id="cpsVal">0</span></div>

    <button id="clicker">👾</button>

    <script>
        let score = 0;
        let clickCount = 0;
        const scoreEl = document.getElementById('scoreVal');
        const clickerBtn = document.getElementById('clicker');

        clickerBtn.addEventListener('click', () => {
            score++;
            scoreEl.textContent = score;
            clickCount++;
        });

        // Simple CPS counter loop
        setInterval(() => {
            document.getElementById('cpsVal').textContent = clickCount;
            clickCount = 0;
        }, 1000);
    </script>

</body>
</html>
